  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [articleId, status, category, language, date]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Titular (H1), type: string, required: true }
      - {
          name: description,
          label: Meta descripción (140-155 caracteres si no es borrador),
          type: text,
          required: true,
        }
      - {
          name: date,
          label: Fecha de publicación (una fecha futura programa el artículo),
          type: date,
          required: true,
        }
      - {
          name: category,
          label: Categoría,
          type: select,
          required: true,
          options:
            {
              values:
                [
                  valoracion,
                  venta,
                  gastos-impuestos,
                  herencias,
                  contratos-documentacion,
                  mercado-barcelona,
                ],
            },
        }
      - {
          name: language,
          label: Idioma del artículo,
          type: select,
          required: true,
          default: es,
          options: { values: [es, en, it, ca] },
        }
      - {
          name: image,
          label: Imagen principal,
          type: image,
          required: true,
          options: { media: images },
        }
      - {
          name: imageAlt,
          label: Descripción de la imagen (accesibilidad),
          type: string,
          required: true,
        }
      - { name: author, label: Autor (vacío = HousySpace), type: string }
      - { name: articleId, label: Identificador (HS-AAAA-MM-NN), type: string, required: true }
      - {
          name: status,
          label: Estado editorial (solo "publicado" sale en la web),
          type: select,
          required: true,
          default: borrador,
          options: { values: [borrador, revisado, aprobado, publicado] },
        }
      - { name: keyword, label: Palabra clave principal, type: string, required: true }
      - {
          name: intent,
          label: Intención de búsqueda,
          type: select,
          required: true,
          options: { values: [informacional, comercial, transaccional] },
        }
      - { name: secondaryKeywords, label: Palabras clave secundarias, type: string, list: true }
      - {
          name: cluster,
          label: "Grupo temático (A valoración y precio, B gastos e impuestos, C proceso de venta, D situaciones especiales)",
          type: select,
          required: true,
          options: { values: [A, B, C, D] },
        }
      - { name: pillar, label: Artículo pilar del grupo, type: boolean, default: false }
      - {
          name: cta,
          label: Objetivo comercial (adónde lleva la llamada a la acción),
          type: select,
          required: true,
          options: { values: [valoracion, venta, consulta] },
        }
      - {
          name: legalFiscal,
          label: Contiene afirmaciones legales,
          fiscales o económicas,
          type: boolean,
          required: true,
          default: false,
        }
      - {
          name: legalReview,
          label: Revisión legal-fiscal,
          type: select,
          required: true,
          default: no_aplica,
          options: { values: [no_aplica, pendiente, aprobada] },
        }
      - name: sources
        label: Fuentes oficiales (obligatorias si es legal-fiscal)
        type: object
        list: true
        fields:
          - { name: label, label: Nombre de la fuente, type: string, required: true }
          - { name: url, label: Enlace (https), type: string, required: true }
          - { name: checkedAt, label: Fecha de comprobación, type: date, required: true }
      - { name: reviewedAt, label: Fecha de la revisión editorial, type: date }
      - { name: updatedAt, label: Fecha de última actualización real, type: date }
      - { name: seoTitle, label: Título SEO (máx. 60 caracteres), type: string }
      - { name: body, label: Texto, type: rich-text, required: true, options: { media: images } }
  - name: testimonials
    label: Reseñas de clientes
    type: collection
    path: src/content/testimonials
    format: json
    filename: "{primary}.json"
    view:
      primary: author
      fields: [author, rating, date]
      sort: [date, author]
      default: { sort: date, order: desc }
    fields:
      - { name: author, label: Autor, type: string, required: true }
      - { name: rating, label: Estrellas (1 a 5), type: number, required: true, default: 5 }
      - { name: text, label: Texto (copiado tal cual), type: text, required: true }
      - { name: date, label: Fecha de la reseña, type: date, required: true }
      - { name: photoUrl, label: Enlace a la foto del autor (opcional), type: string }
      - { name: reviewUrl, label: Enlace a la reseña en Google (opcional), type: string }
      - {
          name: language,
          label: Idioma de la reseña,
          type: select,
          required: true,
          default: es,
          options: { values: [es, en, it, ca] },
        }

