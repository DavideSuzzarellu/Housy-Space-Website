name: Deploy to GitHub Pages
on:
    # Se ejecuta cada vez que hacés push a la rama main
    push:
        branches: [main]
    # Te permite ejecutarlo manualmente desde la pestaña Actions en GitHub
    workflow_dispatch:
# Permisos necesarios para que GitHub Actions pueda publicar la página
permissions:
    contents: read
    pages: write
    id-token: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout del código
              uses: actions/checkout@v4

            - name: Instalar, buildear y subir el sitio
              uses: withastro/action@v3
              with:
                  # Le forzamos a usar bun por las dudas, aunque suele autodetectarlo
                  package-manager: bun
                  node-version: 22
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Publicar en GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
