name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      # INSTALAMOS BUN PRIMERO
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      # PRIMERO LAS DEPENDENCIAS: así Playwright es el del bun.lock y Chromium es su misma versión
      # (con `bunx` sin instalar antes se descarga el Playwright más reciente y el script de PDFs no encuentra su navegador)
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      # AHORA SÍ, DESCARGAMOS CHROMIUM
      - name: Instalar Chromium para generar PDFs
        run: bunx playwright install --with-deps chromium

      # COMPILAMOS ASTRO
      - name: Instalar, buildear y subir el sitio
        uses: withastro/action@v3
        with:
          package-manager: bun
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
